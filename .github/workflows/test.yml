name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - run: chmod +x gradlew && ./gradlew test
      - name: Smoke test (test.py)
        run: ./gradlew runScript -Pargs=test.py --console=plain
      - name: Smoke test (demo.py)
        run: ./gradlew runScript -Pargs=demo.py --console=plain
